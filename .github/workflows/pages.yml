# Builds the web app and publishes it to GitHub Pages.
# Switched off on 2026-11-13: the app runs only on localhost for now, so this no longer starts
# on a push. To put the site back online, add the push trigger again (branches: [main]), turn
# GitHub Pages on for the repository, and open the /playground/ route in the devbox Caddyfile.
name: Deploy web app
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
        env:
          VITE_BASE: /epistemics-playground/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
